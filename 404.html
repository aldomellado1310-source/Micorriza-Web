html,body{height:100%}
body{margin:0;background:radial-gradient(120% 90% at 50% 0%,#0f3426 0%,#081f17 60%);color:var(--papel);font:400 17px/1.65 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}

.box{position:relative;z-index:1;max-width:560px;text-align:center}
.wm{display:inline-block;font-family:"Cormorant Infant",var(--serif);font-weight:600;font-size:1.6rem;letter-spacing:.01em;line-height:1;color:var(--papel);text-decoration:none;margin-bottom:clamp(28px,6vh,56px)}

h1{font-family:var(--serif);font-weight:500;line-height:1.05;letter-spacing:-.02em;margin:0;font-size:clamp(2.4rem,7vw,4.2rem)}
h1 em{font-style:italic;font-weight:300;color:var(--hilo)}
p{margin:20px auto 0;max-width:44ch;color:#cfe0d3}
.acc{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:34px}
.btn{display:inline-flex;align-items:center;gap:.5em;background:var(--lima);color:var(--verde);text-decoration:none;font:600 1rem var(--sans);padding:.85em 1.5em;border-radius:999px;border:1px solid transparent;transition:transform .2s,background .2s}
.btn:hover{background:#8bf055;transform:translateY(-2px)}
.btn.sec{background:transparent;color:var(--papel);border-color:rgba(251,248,240,.35)}
.btn.sec:hover{background:rgba(251,248,240,.08)}
.btn:focus-visible{outline:2px solid var(--papel);outline-offset:3px}
@media(prefers-reduced-motion:reduce){.net .tip{animation:none;opacity:.9}.btn{transition:none}}
